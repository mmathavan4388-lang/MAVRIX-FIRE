# Local full-stack run:  docker compose up --build   → http://localhost:8080
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: mavrix, POSTGRES_PASSWORD: mavrix_dev, POSTGRES_DB: mavrix }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mavrix"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    env_file: [.env]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://mavrix:mavrix_dev@db:5432/mavrix
      DATABASE_SSL: "false"
    ports: ["8080:8080"]
volumes: { pgdata: {} }
