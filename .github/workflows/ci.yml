name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: mavrix, POSTGRES_PASSWORD: mavrix_dev, POSTGRES_DB: mavrix_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mavrix" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://mavrix:mavrix_dev@localhost:5432/mavrix_test
      TEST_DATABASE_URL: postgres://mavrix:mavrix_dev@localhost:5432/mavrix_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm -w web run check:i18n
      - run: npm test
      - run: npm run build
